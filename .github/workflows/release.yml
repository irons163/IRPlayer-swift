name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm tag format and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: Scripts/ci/validate-release-tag.sh "$RELEASE_TAG" origin/main "$RELEASE_COMMIT"

  acceptance:
    name: Acceptance
    needs: validate-tag
    uses: ./.github/workflows/acceptance.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs:
      - validate-tag
      - acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes_file="docs/releases/$version.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "Reviewed release notes are missing: $notes_file" >&2
            exit 1
          fi
          release_args=(
            release create "$RELEASE_TAG"
            --verify-tag
            --notes-file "$notes_file"
            --title "IRPlayer $version"
          )
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
